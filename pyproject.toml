
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpaper-orchestrator"
version = "0.8.0b2"
description = "A configurable multi-monitor wallpaper manager"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "GTSCodes" }
]
dependencies = [
    "Pillow>=11",
    "comtypes>=1.4; sys_platform == 'win32'",
]

[project.scripts]
wallpaper-orchestrator = "wallpaper_orchestrator.cli:main"

[project.gui-scripts]
wallpaper-orchestrator-desktop = "wallpaper_orchestrator.desktop_entry:main"

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]

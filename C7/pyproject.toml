
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpaper-orchestrator"
version = "0.0.0"
description = "A configurable multi-monitor wallpaper manager"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "GTSCodes" }
]
dependencies = [
    "Pillow>=11",
    "comtypes>=1.4; sys_platform == 'win32'",
]

[project.scripts]
wallpaper-orchestrator = "wallpaper_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Windows build and installer validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/c8.3-*', 'feat/c8.3-*']
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows-package:
    outputs:
      version: ${{ steps.version.outputs.value }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate package and installer versions
        id: version
        run: |
          $version = python scripts/check_version.py
          if ($LASTEXITCODE -ne 0) { throw 'Package/installer version mismatch' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/check_version.py --tag $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { throw 'Release tag does not match the package version' }
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -c constraints/windows-ci.txt -e '.[gui,dev]' 'Nuitka>=2.7,<5' 'ordered-set>=4.1' 'zstandard>=0.22'
          if ($LASTEXITCODE -ne 0) { throw 'Installing dependencies failed' }

      - name: Test source code
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Source test suite failed' }

      - name: Build standalone executable
        run: ./scripts/build_windows.ps1 -SkipInstall -SkipTests

      - name: Validate packaged executable
        run: |
          $exe = Join-Path $PWD 'dist\WallpaperOrchestrator\WallpaperOrchestrator.exe'
          if (-not (Test-Path $exe)) { throw 'Standalone executable missing' }
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed: $($process.ExitCode)" }

      - name: Exercise headless agent entry point with isolated Windows data
        run: |
          $exe = Join-Path $PWD 'dist\WallpaperOrchestrator\WallpaperOrchestrator.exe'
          $isolated = Join-Path $env:RUNNER_TEMP 'wallpaper-agent-ci'
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          $original = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = $isolated
            $process = Start-Process -FilePath $exe -ArgumentList '--background-agent' -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "Isolated headless agent exited $($process.ExitCode)" }
            $status = Join-Path $isolated 'WallpaperOrchestrator\background-status.json'
            if (-not (Test-Path $status)) { throw 'No isolated agent status was written' }
            $report = Get-Content $status -Raw | ConvertFrom-Json
            if ($report.running -ne $false) { throw 'CI agent did not stop cleanly' }
          } finally {
            $env:LOCALAPPDATA = $original
          }

      - name: Install Inno Setup compiler
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed' }

      - name: Build Windows installer
        run: ./scripts/build_installer.ps1

      - name: Package versioned artifacts and SHA-256 checksums
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $portable = "dist\WallpaperOrchestrator-$version-Windows-portable.zip"
          $setup = "dist\WallpaperOrchestrator-$version-Windows-Setup.exe"
          Compress-Archive -Path 'dist\WallpaperOrchestrator' -DestinationPath $portable
          Copy-Item -LiteralPath 'dist\WallpaperOrchestrator-Setup.exe' -Destination $setup
          $checksums = @($portable, $setup) | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($_))"
          }
          $checksums | Set-Content -Path "dist\WallpaperOrchestrator-$version-SHA256SUMS.txt" -Encoding ascii
          $files = @($portable, $setup, "dist\WallpaperOrchestrator-$version-SHA256SUMS.txt")
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Artifact missing: $file" }
            Write-Host "Created $file"
          }
          "ARTIFACT_VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload validated release candidates
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperOrchestrator-Windows-${{ env.ARTIFACT_VERSION }}
          path: |
            dist/WallpaperOrchestrator-*-Windows-portable.zip
            dist/WallpaperOrchestrator-*-Windows-Setup.exe
            dist/WallpaperOrchestrator-*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    # Only an explicitly pushed vX.Y.Z tag can publish; PR and main builds
    # upload run artifacts but cannot create a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the validated Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: WallpaperOrchestrator-Windows-${{ needs.windows-package.outputs.version }}
          path: artifacts

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows-package.outputs.version }}
        run: |
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test -f "artifacts/WallpaperOrchestrator-$VERSION-SHA256SUMS.txt"
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --verify-tag --prerelease --title "Wallpaper Orchestrator $GITHUB_REF_NAME" \
            --generate-notes
